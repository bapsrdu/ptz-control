name: Build installers

# Builds the Windows installer and the Mac disk images on GitHub's own Windows
# and Mac machines, so nobody needs a Mac or a Windows build PC.
#
# Ways to start it:
#   - Publish a Release on GitHub (Releases, Draft a new release, new tag such
#     as v0.9.0, Publish). The installers are attached to that Release.
#   - Push a version tag such as v0.9.0 (same result).
#   - Push a commit whose message contains [build installers] to any branch.
#     The installers appear under Artifacts on that Actions run.
#   - Actions tab, Build installers, Run workflow (once this file is on the
#     default branch).
#
# The installers are not code-signed (that needs paid Apple and Windows
# certificates). Windows shows a SmartScreen warning on first run (More info,
# Run anyway); on a Mac, right-click the app and choose Open the first time.

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*"
    branches:
      - "**"

permissions:
  contents: write # only used by the Release step on tag pushes

jobs:
  build:
    # Branch pushes only build when asked to, so everyday commits do not use
    # up Mac build minutes.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build installers]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            files: |
              release/*.exe
          - os: macos-latest
            dist: dist:mac
            files: |
              release/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # A broken commit must not become an installer.
      - name: Unit tests
        run: npm test

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing certificate
        run: npm run ${{ matrix.dist }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ matrix.files }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
          generate_release_notes: true
